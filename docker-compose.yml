version: '3.8'

services:
  # =============================================================================
  # PostgreSQL — SOURCE OF TRUTH
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Redis — JOB QUEUE BACKING STORE (BullMQ)
  # =============================================================================
  # Persists BullMQ jobs. Uses AOF (Append Only File) to minimize data loss.
  # PostgreSQL remains the ultimate source of truth.
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: payment-redis
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Database Migration — runs once, then exits
  # =============================================================================
  db-migrate:
    image: postgres:15-alpine
    container_name: payment-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./database/migrations:/migrations:ro
    entrypoint: >
      sh -c '
        echo "Running database migrations...";
        for f in /migrations/*.sql; do
          echo "Applying $$f";
          psql -f "$$f";
        done;
        echo "Migrations complete.";
      '
    restart: "no"

  # =============================================================================
  # API Service — HTTP INTERFACE (Express)
  # =============================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: payment-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - API_PORT=${API_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # =============================================================================
  # Worker Service — PAYMENT PROCESSOR (BullMQ Worker)
  # =============================================================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: payment-worker
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY}
      - GATEWAY_SUCCESS_RATE=${GATEWAY_SUCCESS_RATE:-70}
      - GATEWAY_RETRYABLE_RATE=${GATEWAY_RETRYABLE_RATE:-20}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
